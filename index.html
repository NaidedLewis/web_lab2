<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лабораторна робота №4 — Варіант 10</title>
<style>
  :root { --bg:#ffffff; --text:#222222; --card:#f3f4f6; --accent:#2b6cb0; }
  body.night { --bg:#1a1a2e; --text:#eaeaea; --card:#16213e; --accent:#e94560; }
  body { background:var(--bg); color:var(--text); font-family:Arial, sans-serif; margin:0;
         transition:background .3s, color .3s; }
  header, main, footer { max-width:800px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border-radius:8px; padding:16px; margin-bottom:16px; }
  button { background:var(--accent); color:#fff; border:none; padding:8px 14px;
           border-radius:6px; cursor:pointer; }
  .row { margin:4px 0; word-break:break-all; }
  .comment { border-bottom:1px solid #8886; padding:8px 0; }
  .comment small { opacity:.7; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
           align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .modal-content { background:var(--bg); color:var(--text); padding:24px; border-radius:8px;
                   width:90%; max-width:420px; box-sizing:border-box; }
  .modal-content label { display:block; margin-top:10px; }
  .modal-content input, .modal-content textarea { width:100%; box-sizing:border-box;
           padding:6px; margin-top:4px; }
  .close { float:right; background:none; color:var(--text); font-size:20px; padding:0 6px; }
</style>
</head>
<body>

<header>
  <h1>Лабораторна робота №4: Робота з JavaScript</h1>
  <p>Варіант 10</p>
</header>

<main>
  <!-- Завдання 1: localStorage -->
  <section class="card">
    <h2>1. Інформація про систему (localStorage)</h2>
    <div id="sysinfo"></div>
  </section>

  <!-- Завдання 2: коментарі з сервера -->
  <section class="card">
    <h2>2. Коментарі (JSONPlaceholder, posts/10)</h2>
    <div id="comments">Завантаження...</div>
  </section>

  <!-- Завдання 4: перемикач теми -->
  <section class="card">
    <h2>4. Тема сайту</h2>
    <p>Денна: 07:00–21:00, нічна: решту часу. Вручну можна перемкнути кнопкою.</p>
    <button id="theme-btn" type="button">Перемкнути тему</button>
  </section>
</main>

<footer id="footer"></footer>

<!-- Завдання 3: модальне вікно зворотного зв'язку -->
<div class="modal" id="feedback-modal">
  <div class="modal-content">
    <button class="close" id="close-modal" type="button" aria-label="Закрити">&times;</button>
    <h2>Зворотний зв'язок</h2>
    <!-- Замініть ВАШ_ЕНДПОІНТ на ваш endpoint із formspree.io -->
    <form action="https://formspree.io/f/ВАШ_ЕНДПОІНТ" method="POST">
      <label>Ім'я
        <input type="text" name="name" required>
      </label>
      <label>Email
        <input type="email" name="email" required>
      </label>
      <label>Номер телефону
        <input type="tel" name="phone">
      </label>
      <label>Повідомлення
        <textarea name="message" rows="4"></textarea>
      </label>
      <button type="submit" style="margin-top:14px">Надіслати</button>
    </form>
  </div>
</div>

<script>
  const VARIANT = 10;

  // ---------- 1. localStorage: інформація про ОС і браузер ----------
  function collectSystemInfo() {
    return {
      os: navigator.platform,
      browser: navigator.userAgent,
      language: navigator.language,
      screen: `${screen.width}x${screen.height}`,
      savedAt: new Date().toISOString()
    };
  }

  function saveAndShowSystemInfo() {
    localStorage.setItem('systemInfo', JSON.stringify(collectSystemInfo()));
    const info = JSON.parse(localStorage.getItem('systemInfo'));
    const box = document.getElementById('sysinfo');
    box.innerHTML = '';
    for (const [key, value] of Object.entries(info)) {
      const p = document.createElement('p');
      p.className = 'row';
      p.textContent = `${key}: ${value}`;
      box.appendChild(p);
    }
    document.getElementById('footer').textContent = `ОС: ${info.os} | Мова: ${info.language}`;
  }

  // ---------- 2. Fetch API: коментарі ----------
  async function loadComments() {
    const box = document.getElementById('comments');
    try {
      const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${VARIANT}/comments`);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const comments = await response.json();
      box.innerHTML = '';
      comments.forEach(c => {
        const div = document.createElement('div');
        div.className = 'comment';
        const title = document.createElement('strong');
        title.textContent = c.name;
        const meta = document.createElement('small');
        meta.textContent = ` (${c.email})`;
        const body = document.createElement('p');
        body.textContent = c.body;
        div.append(title, meta, body);
        box.appendChild(div);
      });
    } catch (error) {
      console.error('Error:', error);
      box.textContent = 'Не вдалося завантажити коментарі.';
    }
  }

  // ---------- 3. Модальне вікно через 1 хвилину ----------
  const modal = document.getElementById('feedback-modal');
  document.getElementById('close-modal').addEventListener('click', () => {
    modal.classList.remove('open');
  });
  setTimeout(() => modal.classList.add('open'), 60000);

  // ---------- 4. День/ніч ----------
  const themeBtn = document.getElementById('theme-btn');

  function isNightNow() {
    const hours = new Date().getHours();
    return hours < 7 || hours >= 21;
  }

  function applyAutoTheme() {
    if (localStorage.getItem('themeOverride') === 'true') return; // ручний вибір має пріоритет
    document.body.classList.toggle('night', isNightNow());
  }

  themeBtn.addEventListener('click', () => {
    document.body.classList.toggle('night');
    localStorage.setItem('themeOverride', 'true');
  });

  // ---------- Запуск ----------
  saveAndShowSystemInfo();
  loadComments();
  applyAutoTheme();
  setInterval(applyAutoTheme, 60000);
</script>
</body>
</html>
